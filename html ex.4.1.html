<!DOCTYPE html>
<html>

<head>
    <title>JavaScript Programs</title>
</head>

<body>

    <h1>JavaScript Examples</h1>

    <script>

       
        let a = 10;
        let b = 5;
        document.write("a = " + a + "<br>");
        document.write("b = " + b + "<br><br>");

        
        document.write("Addition = " + (a + b) + "<br>");
        document.write("Subtraction = " + (a - b) + "<br>");
        document.write("Multiplication = " + (a * b) + "<br>");
        document.write("Division = " + (a / b) + "<br><br>");

     
        if (a > b) {
            document.write("a is greater than b<br><br>");
        } else {
            document.write("b is greater than a<br><br>");
        }

      
        document.write("Numbers:<br>");

        for (let i = 1; i <= 5; i++) {
            document.write(i + "<br>");
        }


        document.write("<br>");

        function add(x, y) {
            return x + y;
        }

        document.write("Function Result = " + add(10, 20));

    </script>

</body>

</html>
