<!DOCTYPE html>
<html>

<head>
    <title>JavaScript Programs</title>
</head>

<body bgcolor="#f4f8ff">

    <center>

        <h1>🌟 JavaScript Examples 🌟</h1>
        <p><b>Basic JavaScript Programs</b></p>

        <hr width="70%">

        <fieldset>
            <legend><b>Variables</b></legend>

            <script>
                let a = 10;
                let b = 5;

                document.write("<h3>Given Numbers</h3>");
                document.write("<table border='1' cellpadding='10'>");
                document.write("<tr><th>Variable</th><th>Value</th></tr>");
                document.write("<tr><td>a</td><td>" + a + "</td></tr>");
                document.write("<tr><td>b</td><td>" + b + "</td></tr>");
                document.write("</table>");
            </script>
        </fieldset>

        <br>

        <fieldset>
            <legend><b>Arithmetic Operations</b></legend>

            <script>
                document.write("<table border='1' cellpadding='10'>");
                document.write("<tr><th>Operation</th><th>Result</th></tr>");
                document.write("<tr><td>Addition </td><td>" + (a + b) + "</td></tr>");
                document.write("<tr><td>Subtraction </td><td>" + (a - b) + "</td></tr>");
                document.write("<tr><td>Multiplication </td><td>" + (a * b) + "</td></tr>");
                document.write("<tr><td>Division </td><td>" + (a / b) + "</td></tr>");
                document.write("</table>");
            </script>
        </fieldset>

        <br>

        <fieldset>
            <legend><b> Comparison</b></legend>

            <script>
                if (a > b) {
                    document.write("<h3>✅ a is greater than b</h3>");
                } else {
                    document.write("<h3>✅ b is greater than a</h3>");
                }
            </script>
        </fieldset>

        <br>

        <fieldset>
            <legend><b>For Loop</b></legend>

            <h3>Numbers from 1 to 5</h3>

            <script>
                for (let i = 1; i <= 5; i++) {
                    document.write("🔹 " + i + "<br>");
                }
            </script>
        </fieldset>

        <br>

        <fieldset>
            <legend><b>Function</b></legend>

            <script>
                function add(x, y) {
                    return x + y;
                }

                document.write("<h3>add(10, 20) = " + add(10, 20) + "</h3>");
            </script>
        </fieldset>

        <br>

        <hr width="70%">

        <h3>🎉 Thank You! 🎉</h3>

    </center>

</body>

</html>
