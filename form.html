<!DOCTYPE html>
<html lang="en">
<head>
<body>
<meta char set="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration Form</title>
<style>
body{
background-color:lightblue;
}
</style>
</head>

<body>

<h2>Student Registration form</h2>

<form>

<label>Full Name:</label><br>
<input type="text" placeholder="Enter Your Full Name" required><br><br>

<label>Email:</label><br>
<input type="Email" placeholder="Enter Your Email" required><br><br>

<label>Password:</label><br>
<input type="Password" placeholder="Enter Password" required><br><br>

<label>Mobile Number:</label><br>
<input type="Mobile Number" placeholder="Enter Mobile Number" required><br><br>

<label>Date Of Birth:</label><br>
<input type="Date"><br><br>

<label>Gender:</label><br>
<input type="radio" name="Gender">Male
<input type="radio" name="Gender">Female
<input type="radio" name="Gender">Other

<br><br>

<label>course:</label><br>
<Select>
<Option>Select course</Option>
<Option>Computer Engineering</Option>
<Option>Information Technology</Option>
<Option>Mechanical Engineering</Option>
<Option>Electronics Engineering</Option>
</Select>

<br><br>

<label>Skills:</label><br>
<input type="Checkbox">HTML
<input type="Checkbox">CSS
<input type="Checkbox">JavaScript
<input type="Checkbox">React

<br><br>

<label>Address:</label><br>
<textarea rows="4" cols"40" placeholder="Enter Your Address"></textarea>

<br><br>

<input type="Submit" value="Register">
<input type="Reset" value="Clear">

</Form>
</body>
</html>
