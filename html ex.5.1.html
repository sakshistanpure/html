<!DOCTYPE html>
<html>

<head>
    <title>DOM Example</title>

    <style>
        .change {
            color: white;
            background-color: purple;
            font-size: 28px;
            padding: 10px;
        }
    </style>
</head>

<body id="body">

    <h1 id="title">Hello Students</h1>

    <p id="message">Welcome to my webpage.</p>

    <img id="photo"
         src="https://www.w3schools.com/html/img_girl.jpg"
         width="200">

    <p>
        <a id="website" href="https://www.google.com">
            Open Google
        </a>
    </p>

    <button onclick="change()">Click Here</button>

    <script>

        function change() {

            document.getElementById("title").innerHTML =
                "JavaScript Changed the Page";

            document.getElementById("message").innerHTML =
                "The paragraph has been changed!";

            document.getElementById("photo").src =
                "https://www.w3schools.com/html/img_chania.jpg";

            document.getElementById("website").href =
                "https://www.w3schools.com/";

            document.getElementById("website").innerHTML =
                "Visit W3Schools";

            document.getElementById("body").style.backgroundColor =
                "lightblue";

            document.getElementById("message").style.fontSize =
                "22px";

            document.getElementById("title").className =
                "change";
        }

    </script>

</body>

</html>
