<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DOM Manipulation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );
        }

        /* Main Container */
        .box {
            width: 600px;
            padding: 35px;

            text-align: center;

            background: rgba(255, 255, 255, 0.95);

            border: none;
            border-radius: 25px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.25);

            transition: all 0.4s ease;
        }

        .box:hover {
            transform: translateY(-5px);

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.3);
        }

        /* Heading */
        h2 {
            margin-top: 0;
            margin-bottom: 10px;

            color: #4f46e5;

            font-size: 32px;
        }

        /* Message */
        #message {
            min-height: 25px;

            color: #555;

            font-size: 16px;

            margin-bottom: 20px;
        }

        /* Image */
        #myImage {
            width: 300px;
            height: 200px;

            object-fit: cover;

            border-radius: 15px;
            border: 4px solid white;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.2);

            transition: transform 0.3s ease;
        }

        #myImage:hover {
            transform: scale(1.05);
        }

        /* Link */
        a {
            display: inline-block;

            margin: 15px 0;

            color: #4f46e5;

            font-weight: bold;

            text-decoration: none;

            transition: all 0.3s ease;
        }

        a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        /* Buttons */
        button {
            width: 220px;

            padding: 12px 18px;

            margin: 5px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            transition: all 0.3s ease;

            box-shadow:
                0 5px 15px rgba(102, 126, 234, 0.3);
        }

        button:hover {
            transform: translateY(-3px);

            box-shadow:
                0 8px 20px rgba(102, 126, 234, 0.5);
        }

        button:active {
            transform: scale(0.96);
        }

        /* New Class */
        .newbox {
            background: linear-gradient(
                135deg,
                #ffe4ec,
                #ffd1dc
            );

            border: 4px solid #ec4899;

            border-radius: 25px;

            padding: 40px;

            box-shadow:
                0 20px 50px rgba(236, 72, 153, 0.3);
        }

        .newbox h2 {
            color: #db2777;
        }

        /* Mobile Responsive */
        @media (max-width: 650px) {

            .box {
                width: 90%;
                padding: 25px 15px;
            }

            h2 {
                font-size: 26px;
            }

            #myImage {
                width: 100%;
                height: auto;
            }

            button {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <div class="box" id="box">

        <h2 id="title">Welcome Students</h2>

        <p id="message">
            Learn DOM Manipulation with JavaScript
        </p>

        <img
            id="myImage"
            src="https://picsum.photos/600/400?random=10"
            alt="Random Image"
        >

        <br><br>

        <a
            id="myLink"
            href="https://www.google.com"
            target="_blank"
        >
            Visit Google
        </a>

        <br><br>

        <button onclick="changestyle()">
            🎨 Change Style
        </button>


        <button onclick="changecontent()">
            ✏️ Change Content
        </button>


        <button onclick="changelink()">
            🔗 Change Link
        </button>

        <br>

        <button onclick="changeimage()">
            🖼️ Change Image
        </button>


        <button onclick="changeclass()">
            ✨ Change Class
        </button>

    </div>


    <script>

        function changestyle() {

            document.getElementById("box").style.backgroundColor =
                "#e0f2fe";

            document.getElementById("box").style.padding =
                "45px";

            document.getElementById("title").style.color =
                "#0284c7";

            document.getElementById("title").style.fontSize =
                "36px";
        }

        function changecontent() {

            document.getElementById("title").innerHTML =
                "🎉 Hello Students!";

            document.getElementById("message").innerHTML =
                "You have successfully changed the content using JavaScript DOM Manipulation!";
        }

        function changelink() {

            let link = document.getElementById("myLink");

            link.href =
                "https://www.wikipedia.org";

            link.textContent =
                "Visit Wikipedia";
        }

        function changeimage() {

            document.getElementById("myImage").src =
                "https://picsum.photos/600/400?random=20";
        }

        function changeclass() {

            document.getElementById("box")
                .classList.add("newbox");
        }

    </script>

</body>

</html>
